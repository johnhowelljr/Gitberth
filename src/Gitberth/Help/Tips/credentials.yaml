# Tips for the token watch's banners (Credentials/CredentialWatch.cs, shown by Components/Shared/AttentionBanners.razor on
# the dashboard and in the token's Settings section). See Help/TipCatalog.cs.

credentials.expiring:
  title: A token about to expire
  text: >-
    The service stops taking this token on the day shown. Gitberth says so 3 weeks, a week and a day before (an API
    token a week and a day before); make a new token there and save it in Settings before then. Dismissing the banner
    hides it until the next of those.
  more: guides/troubleshooting#tokens-and-sign-ins

credentials.expired:
  title: A token that has expired
  text: >-
    The service stopped taking this token on the day shown, so what needs it has stopped: private repos don't deploy, or
    domains can't change, or an agent can't reach Gitberth. Make a new token there and save it in Settings; the banner
    goes the moment you do.
  more: guides/troubleshooting#tokens-and-sign-ins

credentials.refused:
  title: A token its service refused
  text: >-
    The service turned the token away, and again when Gitberth checked it at once: it has expired, was revoked or
    deleted. What needs it waits until you save a new one, and the banner goes the moment you do.
  more: guides/troubleshooting#tokens-and-sign-ins
