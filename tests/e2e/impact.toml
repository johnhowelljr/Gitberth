"33" = { file = "test_33_gitlab.py", minutes = 10, test_minutes = 4.09 }
# The built-in Help and the tips: measured on the first rig (2026-11-16, its 4 tests in 20 s). It deploys no app and
# waits on nothing the timings change, so production's minutes are the same.
"34" = { file = "test_34_help.py", minutes = 0.33, test_minutes = 0.33 }
# Stability: keeping apps running (35), Docker's disk (36) and the tokens Gitberth uses (37). 35 deploys one test app and
# crashes, stops and removes it (estimated, with keepEvery=3: the check looks every 3 s; with production timings every
# 30 s, and a stopped app waits 30 s). 36 cleans up on request, and deploys one app to delete: measured on the first rig
# (2026-11-20, its 3 tests and 22's build cache row in 26 s); production's minutes add the deploy's 15 s stay-up check.
# 37's measured on rig b (2026-11-21, its 4 tests in 90 s): they deploy no app and wait on nothing the timings change,
# so production's minutes are the same.
"35" = { file = "test_35_keep_running.py", minutes = 5, test_minutes = 3 }
