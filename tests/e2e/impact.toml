# with Test the destination and Back up now. Measured on the first rig (2026-11-28): 2 min without FTP; it deploys no app,
# so production's minutes are about the same. SeaweedFS's image and the Samba, FTP and helper images once per rig volume.
"41" = { file = "test_41_auto_backups.py", minutes = 5, test_minutes = 4 }
# Gitberth updating itself: to a newer build of itself (gitberth:9.9.1, the GitHub stand-in's newest release), then to a
# broken one that the updater undoes, then back to gitberth:e2e. Three swaps of Gitberth's container; estimate.
"44" = { file = "test_44_self_update.py", minutes = 5, test_minutes = 4 }
# Deploy a folder (B6): a static site zip and a Node app's folder (the browser's folder upload) made in New app and
# deployed, the Node app's new version through the API with a token, and a zip-slip archive refused. Estimates: two first
# builds (nginx and node pulled once per rig volume) and one more; minutes adds production's stay-up checks.
"46" = { file = "test_46_uploads.py", minutes = 5, test_minutes = 3.5 }
# Release and scheduled commands (B2): one uploaded app (nginx with a VOLUME) whose release command fails a new version's
# deploy (the old one serving on) and then writes a marker the next version serves; its Scheduled commands card's Run
# now, and a failing command every minute told to a webhook. Estimates: three nginx builds, a minute's wait for the
# schedule; minutes adds production's stay-up checks.
"42" = { file = "test_42_commands.py", minutes = 5, test_minutes = 4 }
# Terminal, files and config files (B3): one image app with a volume: its terminal runs a command over the WebSocket (and
# a socket without a ticket, or from another Origin, is refused), its Files tab uploads, downloads and deletes in the
# volume and refuses a path out of it, and a config file appears in it and changes in place. Estimates.
"43" = { file = "test_43_workbench.py", minutes = 5, test_minutes = 4 }

