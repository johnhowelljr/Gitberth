         "src/Gitberth/Components/Layout/AttentionPill.razor"]
groups = ["37", "20"]                          # the dashboard's banners and the top bar's pill

# --- automatic backups (41): the schedule, the destinations (a folder, SMB, S3) and their card; the sealed format and host
# folders are the file's (both groups).
[[rule]]
globs = ["src/Gitberth/Backup/AutoBackups.cs", "src/Gitberth/Backup/AutoBackupConfig.cs", "src/Gitberth/Backup/AutoDestinations.cs",
         "src/Gitberth/Backup/S3Client.cs", "src/Gitberth/Components/Shared/AutoBackupSection.razor", "src/Gitberth/Components/Shared/AutoBackupView.cs"]
groups = ["41"]

# --- Gitberth updating itself (44): the check, Update now, the updater and its way back, the card, /healthz's version.
[[rule]]
globs = ["src/Gitberth/Images/UpdateGitberth.cs", "src/Gitberth/Images/UpdateGitberthRules.cs", "src/Gitberth/Images/UpdateGitberthRunner.cs",
         "src/Gitberth/Components/Shared/GitberthUpdateCard.razor", "src/Gitberth/AppVersion.cs"]
groups = ["44"]

# --- save and restore (40): the file, saving and restoring (Backup/), Settings › Save and restore, the Restoring page.
# Program.cs (the endpoints, the boot swap) and the Docker client's new calls keep their own rules (@wide).
[[rule]]
globs = ["src/Gitberth/Backup/**", "src/Gitberth/Components/Shared/BackupSection.razor", "src/Gitberth/Components/Shared/BackupText.cs",
         "src/Gitberth/Components/Pages/RestoringPage.razor", "src/Gitberth/wwwroot/css/backup.css",
         "src/Gitberth/Components/Layout/ReconnectModal.razor.js"]   # its reload waits while a restore restarts Gitberth
groups = ["40", "41"]


# ===== E. Folders (new files and anything not named above) =====
[[rule]]
globs = ["src/Gitberth/Agents/**"]
groups = ["29", "32"]
refine = [
    { match = '[Gg]it[Ll]ab|RepoFullName', groups = ["29", "@t33-api"] },   # get_app's git, get_settings' gitlab
    { match = 'search_images|list_image_tags|image =', groups = ["39", "29"] },   # Docker Hub's search and an image's tags
]

[[rule]]
globs = ["src/Gitberth/Audit/**"]
groups = ["29", "@t24-audit"]
refine = [
    # GitLab as an actor (its webhook), its trigger's words, and Settings › GitLab's entries.
    { match = '[Gg]it[Ll]ab', groups = ["@t24-audit", "@t33-settings", "@t33-instant"] },
]

[[rule]]
globs = ["src/Gitberth/Compose/**"]
groups = ["28", "30", "32"]

[[rule]]
globs = ["src/Gitberth/Databases/**"]
groups = ["27", "32"]

[[rule]]
globs = ["src/Gitberth/Templates/**"]
groups = ["30", "32"]

[[rule]]
globs = ["src/Gitberth/Previews/**"]  # PreviewService, PreviewPlanner, PreviewStates, PreviewGate
groups = ["01", "02", "03", "04", "05", "11"]
refine = [
    { match = 'Promot', groups = ["10", "11"] },
    { match = '[Ll]imit|Waiting|[Ww]aits', groups = ["04"] },
    { match = '[Ff]ork', groups = ["03"] },
    { match = 'Remov|Delete|Gate|Expir', groups = ["05"] },
    { match = 'Domain|Protect', groups = ["05", "16"] },
    { match = '[Bb]ranch', groups = ["01"] },
    { match = '[Pp]ull', groups = ["02"] },
    { match = '[Gg]it[Ll]ab|GitHost|[Mm]erge request', groups = ["@t33-mr", "@t33-fork"] },   # merge requests' previews
]

[[rule]]
globs = ["src/Gitberth/Domains/**"]
groups = ["05", "16", "17", "18", "25", "26"]

[[rule]]
globs = ["src/Gitberth/Public/**"]  # PublicPages is the very first middleware
groups = ["16", "17", "25", "26"]

[[rule]]
globs = ["src/Gitberth/Uptime/**"]
groups = ["26"]

[[rule]]
globs = ["src/Gitberth/Notifications/**"]
groups = ["21", "26"]

# Docker Hub's search, an image's tags and their ranking (the tag picker's backend), and what's kept about the hosts asked:
# the image search's scenario.
[[rule]]
globs = ["src/Gitberth/Images/DockerHubApi.cs", "src/Gitberth/Images/TagRanking.cs", "src/Gitberth/Images/TagViews.cs",
         "src/Gitberth/Images/ImagePickerContracts.cs", "src/Gitberth/Images/HostGates.cs"]
groups = ["39"]

# The registry client lists tags and reads an image's config before a pull (New app's Configure, signed in or not).
[[rule]]
globs = ["src/Gitberth/Images/RegistryClient.cs"]
groups = ["39", "@t24-registry"]

# The façade: its search, tags and digests are the image search's; the rest (pulls, the host's images, facts, updates) is
# what the database and template scenarios pull through, as for any other file here.
[[rule]]
globs = ["src/Gitberth/Images/ImageService.cs"]
groups = ["27", "32", "@t24-registry"]
refine = [
    { match = 'SearchAsync|TagsAsync|RegistryTagsAsync|ListedAsync|NoTags|DigestsOf|DockerHub|HostArchitecture|Lookups|HostWaitCap|HostGates|TimedCache|MaxListedTags', groups = ["39"] },
    # An image's facts read from its registry before a pull (39's registry.e2e.test check), and the host's platform both use.
    { match = 'RemoteFacts|PlatformAsync|HostPlatform', groups = ["27", "32", "39", "@t24-registry"] },
]

[[rule]]
globs = ["src/Gitberth/Images/**"]
groups = ["27", "32", "@t24-registry"]
notes = ["Also run the engine tests on a Docker host: GITBERTH_ENGINE_IT=1 dotnet test tests/Gitberth.Tests (EngineIntegrationTests, ImageEngineIntegrationTests). No scenario reaches these engine calls themselves."]

[[rule]]
globs = ["src/Gitberth/Health/**"]  # stats, Health page: no scenario
groups = ["@smoke"]

[[rule]]
globs = ["src/Gitberth/Network/**", "src/Gitberth/Docker/HostScan.cs", "src/Gitberth/Docker/ProcNet.cs",
         "src/Gitberth/Docker/NetworkContainer.cs"]
groups = ["17", "18", "24"]

[[rule]]
globs = ["src/Gitberth/Docker/**"]
groups = ["@wide"]

[[rule]]
globs = ["src/Gitberth/Git/**"]
groups = ["01", "02", "03", "11", "20", "29"]
refine = [
    # git with GitLab's token header, its merge request refs, and the repo kinds (GitHub's too).
    { match = '[Gg]it[Ll]ab|merge-requests|RepoRef', groups = ["01", "02", "03", "11", "20", "29", "33"] },
]

[[rule]]
globs = ["src/Gitberth/Security/**"]
groups = ["20", "@t24-audit"]

[[rule]]
globs = ["src/Gitberth/Detection/**"]  # language detectors: unit tests and tests/samples; New app's analysis runs in the smoke
groups = ["@smoke"]

[[rule]]
globs = ["src/Gitberth/Sources/**"]
groups = ["20", "@t28-paste"]

[[rule]]
globs = ["src/Gitberth/Services/**", "src/Gitberth/Apps/**", "src/Gitberth/Deploy/**"]
groups = ["@wide"]

[[rule]]
globs = ["src/Gitberth/Components/NewApp/**"]
groups = ["20", "30", "@t28-paste"]

[[rule]]
globs = ["src/Gitberth/Components/Apps/**"]
groups = ["06", "20"]

[[rule]]
globs = ["src/Gitberth/Components/**", "src/Gitberth/wwwroot/**"]
groups = ["01", "20"]


# ===== F. Anything else: @wide, and impact.py warns that a rule is missing =====
[[rule]]
globs = ["**"]
groups = ["@wide"]
catch_all = true
