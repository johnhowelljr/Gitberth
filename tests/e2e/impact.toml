# gitberth-buildkit and its volume made afresh); minutes is still the estimate, until a run with production timings.
# A fresh rig volume adds 2-3 min once, pulling BuildKit and Railpack's images.
"38" = { file = "test_38_railpack.py", minutes = 4, test_minutes = 2.05 }
# Docker Hub's search and the tag picker, against the Docker Hub stand-in and registry.e2e.test: New app's search and its
# picker, one redis app made by create_app and recreated on another tag twice (Choose tag…, then the agents' tools), and
# Docker Hub not answering (its 429 waited out, 10 s, and its hubWait). test_minutes measured on rig b (2026-11-22, its
# 5 tests in 51 s, redis:8-alpine already pulled; a fresh rig volume adds that pull once); minutes is the estimate for
# production timings (three 15 s stay-up checks, and a minute's hold instead of hubWait's 10 s).
"39" = { file = "test_39_docker_hub.py", minutes = 2.5, test_minutes = 1.0 }
# Save and restore: Settings › Save and restore's passphrase checks, then a Git app (volume marker, secret, a Postgres
# database with a row), its Postgres server and a redis app saved through the page, the host wiped (Gitberth's data volume
# emptied, its apps' containers, volumes and images removed), and the file restored through the page across Gitberth's
# restart; and picked items into a Gitberth with other apps: a deleted app restored, then restored as a copy beside it.
# Estimates (the whole restore measured at 2.4 min on rig b, 2026-11-23; the picked ones about 4 more, plan2 P8): Git
# builds, Postgres made once per rig volume; minutes adds production's stay-up checks. Refresh both from a run's junit.xml.
"40" = { file = "test_40_save_restore.py", minutes = 10, test_minutes = 6.5 }
# Automatic backups: a folder on the rig's host (keep-N, and one container restored from a listed backup), an S3 server
