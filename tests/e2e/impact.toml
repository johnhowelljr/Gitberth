# How the template smoke is split into shards: heavier templates count for more (the default is 1).
[templates]
weight = { nextcloud = 3, stirling-pdf = 3, paperless-ngx = 2, jellyfin = 2, ghost = 2, wordpress = 2 }

# ===== A. Nothing to run in the rig (the unit suite still runs) =====
[[rule]]
globs = ["README.md", "PLAN.md", "CONTRIBUTING.md", "LICENSE.md", "THIRD-PARTY-NOTICES.md", ".gitleaks.toml",
         ".github/**", ".gitignore", ".env.example", "tests/e2e/README.md", "tests/e2e/impact.py", "tests/e2e/impact.toml",
         "tests/e2e/impact_test.py", "tests/e2e/shots/**"]  # shots/: the docs' screenshots, taken on demand only
groups = ["@none"]

# The docs are built into Gitberth's image (its Help, /help): pages, pictures, flow charts and help.yaml. The unit tests
# check their links, headings and manifest; the scenario shows them drawn and loaded.
[[rule]]
globs = ["docs/**"]
groups = ["34"]

[[rule]]
globs = ["tests/Gitberth.Tests/**", "tests/Gitberth.UiTests/**", "tests/samples/**", "dotnet-tools.json",
         "Gitberth.slnx", "install.sh"]
groups = ["@none"]


# ===== B. The rig and the scenarios =====
[[rule]]
globs = ["tests/e2e/scenarios/test_*.py"]
groups = ["@self+importers"]

[[rule]]
globs = ["tests/e2e/scenarios/e2e/audit.py"]
groups = ["12", "14", "24", "27", "28", "29", "30", "32"]

[[rule]]
globs = ["tests/e2e/scenarios/e2e/github_reports.py"]
groups = ["12", "13", "15", "16", "17", "22", "24", "25"]

[[rule]]
globs = ["tests/e2e/standins/gl.py", "tests/e2e/scenarios/e2e/gitlab.py"]  # the GitLab stand-in and its client
groups = ["@t00-gitlab", "33"]

[[rule]]
globs = ["tests/e2e/scenarios/e2e/**", "tests/e2e/scenarios/conftest.py"]
groups = ["00", "@wide"]
refine = [
    { match = 'expires_on', groups = ["00", "37"] },   # a Cloudflare token's end date (standin.py's helpers)
    { match = '[Dd]ocker ?[Hh]ub|dockerhub|registry\.e2e', groups = ["@t00-dockerhub", "39"] },   # the Docker Hub stand-in's client
]

[[rule]]
globs = ["tests/e2e/scenarios/Dockerfile", "tests/e2e/scenarios/pytest.ini"]
groups = ["00", "@smoke"]

[[rule]]
globs = ["tests/e2e/standins/cloudflared/**", "tests/e2e/standins/ingress.py", "tests/e2e/standins/cf.py"]
groups = ["00", "05", "16", "17", "18", "23", "25", "26"]
refine = [
    # A token's end date, and what verify and the other calls make of a token that isn't active.
    { match = 'expires_on|def expired|def active|self\.active|verified', groups = ["00", "16", "37"] },
]

[[rule]]
globs = ["tests/e2e/standins/gh.py"]
groups = ["00", "02", "12", "14"]
refine = [
    { match = 'pull', groups = ["00", "01", "02", "03", "04"] },
    { match = 'status|comment', groups = ["00", "12", "13", "15"] },
    { match = 'hook|deliver|signature|ping', groups = ["00", "14", "15", "23"] },
    { match = 'variable', groups = ["00", "09", "24"] },
    { match = 'rate|limit|permission|token', groups = ["00", "15"] },
