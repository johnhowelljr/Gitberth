# Which end-to-end groups a change needs. tests/e2e/impact.py reads this file (impact.py plan), and impact.py check
# checks it against the tree. Paths are repo-relative globs: "*" stays within a folder, "**" crosses folders. For each
# changed file the FIRST rule whose globs match decides, so specific rules come first, then folders, then the catch-all.
# A rule's groups name groups ("12"; "12+slow" keeps its slow tests), aliases ("@smoke") and single tests (node IDs).
# A rule's refine entries look at the changed hunks (the changed lines, 3 lines around them, and the declaration they
# sit in): when any entry's regex matches, only the matching entries' groups count; otherwise the rule's own groups do.
# notes (on a rule or a refine entry) name what else to run when no scenario reaches the code: impact.py prints them.
# "@self+importers" (a scenario file): its own group, plus every group that imports a name the change touched.
# The content and its reasons: the impact map of 2026-11-16 (each group's coverage, the hubs and the smoke).
version = 1

# The default tier (impact) fits a wall-time budget: the unit tests (beside the rigs' setup), then both lanes. Within it,
# by priority: the core smoke (@core, always), one test of each thing the change points at (refine hits and scenario
# files first, then rules in this file's order, @wide last), the rest of those groups' tests one by one, then the rest
# of the smoke. What doesn't fit is listed as left for the full suite (full and release, on demand). impact.py plan
# --budget overrides the minutes; 0 means no limit.
[budget]
minutes = 10
setup = 3.6        # the unit tests (about 2.5 min, plus 1 to build), beside the rigs' up: 3.6 min measured on 2026-11-16

# Estimates with the rig's test timings (GITBERTH_TEST_TIMINGS, the default for every run but the template smoke): a
# group's test_minutes (and test_slow) when it has them, else its minutes times this factor. impact.py minutes
# DIR... --timings test reads a run's junit.xml and prints the lines to refresh them with.
[test_timings]
# 0.75, not 0.5: the first two-lane impact run (2026-11-16) took 9.7 and 8.7 min of pytest time on lanes estimated at
# 6.5 min each with 0.5 (a single test carries its own app's setup, which the per-test share of a group's minutes misses).
factor = 0.75

# Each group: its file; its minutes of pytest time without its slow tests, with production timings (refresh them with
# impact.py minutes --timings production); its slow tests and their minutes (left out unless a rule or alias says
# "NN+slow"); optionally test_minutes and test_slow, the same with test timings. The template smoke is always a run of
# its own (-k test_31_template_smoke), with production timings and E2E_TEMPLATES.
[groups]
"00" = { file = "test_00_rig.py", minutes = 0.95, test_minutes = 1.04 }  # with the GitLab stand-in's self-tests (2026-11-16, rig b)
"01" = { file = "test_01_branch_previews.py", minutes = 1.7, test_minutes = 2.2 }
"02" = { file = "test_02_pull_request_previews.py", minutes = 10.5 }
"03" = { file = "test_03_forks.py", minutes = 4 }
"04" = { file = "test_04_preview_limit.py", minutes = 4.5 }
"05" = { file = "test_05_preview_removal.py", minutes = 9 }
"06" = { file = "test_06_copying.py", minutes = 2.75 }
"07" = { file = "test_07_crons.py", minutes = 3.75 }
"09" = { file = "test_09_scoped_variables.py", minutes = 2.5 }
"10" = { file = "test_10_build_time_secrets.py", minutes = 4 }
"11" = { file = "test_11_promote.py", minutes = 5.5 }
"12" = { file = "test_12_commit_statuses.py", minutes = 7, slow = { test_a_scheduled_restart_posts_no_status = 6.5 }, test_slow = { test_a_scheduled_restart_posts_no_status = 1.9 } }
"13" = { file = "test_13_pr_comments.py", minutes = 5 }
"14" = { file = "test_14_instant_deploys.py", minutes = 13, slow = { test_a_repo_deployed_later_gets_the_webhook_at_the_keepers_own_next_look = 10 }, test_slow = { test_a_repo_deployed_later_gets_the_webhook_at_the_keepers_own_next_look = 10 } }
"15" = { file = "test_15_refusals.py", minutes = 9 }
