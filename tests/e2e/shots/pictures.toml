# Which of the docs' pictures a change makes stale. tests/e2e/shots/stale.py reads this file, and shots/run.sh retakes
# only the stale pictures: those that show a file that changed after the commit they were last taken from (taken.toml).
# When none is stale, nothing runs. Paths are repo-relative globs, as in ../impact.toml: "*" stays within a folder, "**"
# crosses folders. "@name" stands for a [sets] entry's globs. List what a picture shows: its page or section, the
# components drawn in it, its styles, and the files its words come from when they aren't in the component (a backup's
# warnings, a guide's text). stale.py check checks the map: every picture docs/images has and test_shots.py takes is
# here, and every glob matches a file.
version = 1

# What every picture shows: Gitberth's look (its theme, global styles and fonts), the building blocks on every page
# (buttons, fields, banners, switches, tips, icons, badges, little charts), and the frame around each picture.
all = [
  "src/Gitberth/wwwroot/app.css",
  "src/Gitberth/wwwroot/fonts/**",
  "src/Gitberth/wwwroot/css/tips.css",
  "src/Gitberth/Components/App.razor",
  "src/Gitberth/Components/GitberthTheme.cs",
  "src/Gitberth/Components/Shared/AccessTag.razor",
  "src/Gitberth/Components/Shared/AddressValue.razor",
  "src/Gitberth/Components/Shared/AppKinds.cs",
  "src/Gitberth/Components/Shared/AppLogo.razor",
  "src/Gitberth/Components/Shared/AppStatus.cs",
  "src/Gitberth/Components/Shared/Banner.razor",
  "src/Gitberth/Components/Shared/Btn.razor",
  "src/Gitberth/Components/Shared/BtnKind.cs",
  "src/Gitberth/Components/Shared/ChartMath.cs",
  "src/Gitberth/Components/Shared/CodeBlock.razor",
  "src/Gitberth/Components/Shared/CopyButton.razor",
  "src/Gitberth/Components/Shared/CopyText.razor",
  "src/Gitberth/Components/Shared/DeployPill.razor",
  "src/Gitberth/Components/Shared/EmptyState.razor",
  "src/Gitberth/Components/Shared/Field.razor",
  "src/Gitberth/Components/Shared/GitberthIcons.cs",
  "src/Gitberth/Components/Shared/HeroStat.razor",
  "src/Gitberth/Components/Shared/Logo.razor",
  "src/Gitberth/Components/Shared/LogoCatalog*.cs",
  "src/Gitberth/Components/Shared/Meter.razor",
  "src/Gitberth/Components/Shared/PageHead.razor",
  "src/Gitberth/Components/Shared/PageHeader.razor",
  "src/Gitberth/Components/Shared/PageHelpLink.razor",
  "src/Gitberth/Components/Shared/PortChip.razor",
  "src/Gitberth/Components/Shared/Section.razor",
  "src/Gitberth/Components/Shared/SectionCard.razor",
  "src/Gitberth/Components/Shared/Seg.razor",
  "src/Gitberth/Components/Shared/SegOption.cs",
  "src/Gitberth/Components/Shared/SettingsSection.razor",
  "src/Gitberth/Components/Shared/SourceBadge.razor",
  "src/Gitberth/Components/Shared/Sparkline.razor",
  "src/Gitberth/Components/Shared/SparkPath.cs",
  "src/Gitberth/Components/Shared/StatusDot.razor",
  "src/Gitberth/Components/Shared/StatusLabel.razor",
  "src/Gitberth/Components/Shared/SvgIcon.razor",
  "src/Gitberth/Components/Shared/SwitchRow.razor",
  "src/Gitberth/Components/Shared/TabBar.razor",
  "src/Gitberth/Components/Shared/TabItem.cs",
  "src/Gitberth/Components/Shared/TimeChart.razor",
  "src/Gitberth/Components/Shared/Tip.razor",
  "src/Gitberth/Components/Shared/Waffle.razor",
  "src/Gitberth/Components/Shared/WatchBadge.razor",
  "tests/e2e/shots/frame.py",
]

# What a whole-window picture shows around its page: the sidebar, the top bar and its menus. A detail picture (one
# section or dialog) doesn't show them, and neither do the whole-window pictures in window_except: the sign-in page and
# the public pages have none.
window = ["src/Gitberth/Components/Layout/**"]
window_except = ["down-page", "login", "status-page"]

# A change to one of these files counts only within its section: from the first line `from` matches to the next line
# `to` matches, or the file's end. gitberth.js holds every page's scripts; only its charts' (Shared/TimeChart.razor's,
# its last section) are in pictures.
[only_within]
"src/Gitberth/wwwroot/js/gitberth.js" = { from = "^// -+ Charts" }

[sets]
# An app's page: its hero (name, status, actions) and tabs.
app-page = [
  "src/Gitberth/Components/Pages/AppPage.razor",
  "src/Gitberth/Components/Shared/AppHero.razor",
  "src/Gitberth/Components/Apps/KeeperBanner.razor",
]
# An app's Overview tab: its cards, and its CPU and memory charts (drawn by gitberth.js).
overview = [
  "src/Gitberth/Components/Apps/AppOverviewTab.razor",
  "src/Gitberth/Components/Shared/ActivityTimeline.razor",
  "src/Gitberth/Components/Apps/UptimeCard.razor",
  "src/Gitberth/Components/Shared/ScheduledJobsCard.razor",
  "src/Gitberth/Components/Apps/DatabasesCard.razor",
  "src/Gitberth/wwwroot/css/uptime.css",
  "src/Gitberth/wwwroot/js/gitberth.js",
]
# An app's Settings tab, around its sections.
app-settings = [
  "src/Gitberth/Components/Apps/AppSettingsTab.razor",
  "src/Gitberth/Components/Shared/ApplyBar.razor",
]
# New app, around each source's form.
new-app = [
  "src/Gitberth/Components/NewApp/NewAppPage.razor",
  "src/Gitberth/Components/NewApp/NewAppState.cs",
  "src/Gitberth/wwwroot/css/network-newapp.css",
]
# New app's Configure step: the settings a new app starts with.
configure = [
  "src/Gitberth/Components/NewApp/ConfigureForm.razor",
  "src/Gitberth/Components/NewApp/ParseIssues.razor",
  "src/Gitberth/Components/Shared/Network/PortsTable.razor",
  "src/Gitberth/Components/Apps/ResourceFields.razor",
  "src/Gitberth/Components/Apps/SettingsAdvanced.razor",
  "src/Gitberth/Components/Apps/SettingsLabels.razor",
  "src/Gitberth/Components/Apps/SettingsLogging.razor",
  "src/Gitberth/Components/Shared/EnvEditor.razor",
  "src/Gitberth/Components/Shared/VolumesEditor.razor",
]
# Gitberth's Settings page: its sections are drawn in it, or in a component of their own besides.
settings = ["src/Gitberth/Components/Pages/SettingsPage.razor"]
# Save and restore, and what a backup holds and warns about.
backup = [
  "src/Gitberth/Components/Shared/BackupSection.razor",
  "src/Gitberth/Components/Shared/BackupText.cs",
  "src/Gitberth/wwwroot/css/backup.css",
  "src/Gitberth/Backup/**",
]
# The templates: the gallery, a template's page and its first steps, from the catalog.
templates = [
  "src/Gitberth/Components/NewApp/TemplateSource.razor",
  "src/Gitberth/wwwroot/css/templates.css",
  "src/Gitberth/Templates/**",
]
# An app's network: ports, addresses, domains, networks and the changes to them.
network = [
  "src/Gitberth/Components/Shared/Network/**",
  "src/Gitberth/wwwroot/css/network-newapp.css",
]
# The tag picker (its styles are in network-newapp.css).
tags = [
  "src/Gitberth/Components/Shared/TagPicker.razor",
  "src/Gitberth/Components/Shared/TagPickerDialog.razor",
  "src/Gitberth/Components/Shared/ImagePickerText.cs",
  "src/Gitberth/wwwroot/css/network-newapp.css",
]
# New app's Registry source: Docker Hub's search and Popular (New app opens on it).
registry = [
  "src/Gitberth/Components/NewApp/RegistrySource.razor",
  "src/Gitberth/Components/Shared/ImagePickerText.cs",
]
# A log, as Gitberth shows one.
log = [
  "src/Gitberth/Components/Shared/LogView.razor",
  "src/Gitberth/Components/Shared/LogLine.cs",
]
# A change applied after a review: its steps.
change = [
  "src/Gitberth/Components/Shared/ChangeDialog.razor",
  "src/Gitberth/Components/Shared/Network/ChangeSteps.razor",
  "src/Gitberth/Components/Shared/Network/ChangeText.cs",
]
# The Apps list's rows.
apps = [
  "src/Gitberth/Components/Pages/Apps.razor",
  "src/Gitberth/Components/Apps/AppRow.razor",
  "src/Gitberth/Components/Apps/AppListView.cs",
]
# The public pages Gitberth serves itself.
public = ["src/Gitberth/Public/**"]

