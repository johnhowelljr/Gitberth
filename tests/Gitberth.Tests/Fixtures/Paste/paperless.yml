name: paperless
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"

services:
  broker:
    <<: *common
    image: docker.io/library/redis:7
    volumes:
      - redisdata:/data

  db:
    <<: *common
    image: postgres:${PG_VERSION:-16}
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless"]
      interval: 10s
      timeout: 5s
      retries: 5

  webserver:
    <<: *common
    image: ghcr.io/paperless-ngx/paperless-ngx:2.13
    container_name: paperless
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    ports:
      - "8000:8000"
      - target: 9000
        published: "9100"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - data:/usr/src/paperless/data
      - /srv/paperless/consume:/usr/src/paperless/consume
      - type: bind
        source: /srv/paperless/export
        target: /usr/src/paperless/export
        read_only: true
      - type: tmpfs
        target: /tmp/paperless
        tmpfs:
          size: 64m
    env_file: docker-compose.env
    environment:
      - PAPERLESS_REDIS=redis://broker:6379
      - PAPERLESS_DBHOST=db
      - PAPERLESS_SECRET_KEY=$${NOT_INTERPOLATED}
      - PAPERLESS_URL
    networks:
      default:
      backend:
        aliases: [paper]
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"
          pids: 200
        reservations:
          memory: 256m
    x-notes: kept out

volumes:
  data:
  pgdata:
    name: paperless_pgdata_real
  redisdata:
    external: true

networks:
  backend:
    external: true
    name: shared-backend