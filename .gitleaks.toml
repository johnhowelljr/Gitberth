# The secret scan (gitleaks) that GitHub's checks run on every commit and the publishing check runs before every push.
# It uses gitleaks's own rules. The only values allowed through are the made-up ones below, which tests, sample apps and
# docs use on purpose: none of them is a real credential. Add one here only after checking it's made up.
title = "Gitberth"

[extend]
useDefault = true

[allowlist]
description = "Made-up values in tests, sample apps and docs"
regexes = [
    '''kX4pQ7vRt2LmN9sWb3Ye''',                                         # the example admin password in the docs
    '''tok-9f8e7d6c5b4a''',                                             # a test's API_TOKEN
    '''Hunter2RevSafety''',                                             # a test's database password
    '''RevSafetyStandIn''',                                             # a test's stand-in token, in clear
    '''eyJhIjoiUmV2U2FmZXR5U3RhbmRJbiIsInQiOiJ0dW5uZWwiLCJzIjoic2VjcmV0In0''',  # the same, as a tunnel token
    '''8cec7368141e768f44ed03e142576d0c''',                             # the Symfony sample's APP_SECRET
    '''b7ba75f379ba456c40dd863a6bc82abb9a220e3fc93fcf1c383cdcf0924d6d36e558d35f90999ccf5f2d8963feab2b70b72cb9a160f7975a4b8e40a1519b757e''',  # the Rails sample's SECRET_KEY_BASE
]
