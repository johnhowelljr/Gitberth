# Tests every push and pull request. A release, and every push to main, then publish the image to
# ghcr.io/<owner>/gitberth for Intel/AMD and ARM:
#   a release v1.2.3  →  :1.2.3, :1.2 and :latest (a pre-release gets only its own version, like :1.3.0-rc.1)
#   a push to main    →  :edge
#   every build       →  :sha-<commit>
# A release is made either way:
#   - on GitHub (Releases › Draft a new release, with a new tag like v1.2.3): publishing it builds the image;
#   - by pushing a tag like v1.2.3 with git: this workflow makes its GitHub release, with generated notes, and builds.
# A release made on GitHub also creates its tag; the tag's own run then finds the release already there and leaves the
# build to the release's run, so each release builds once.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # The same SDK image the tests are run in by hand, so CI sees what a developer sees.
    container: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: dotnet test tests/Gitberth.Tests --nologo

  release:
    name: Release
    # A version tag pushed with git: its GitHub release, unless one was made on GitHub already.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      made: ${{ steps.make.outputs.made }}
    steps:
      - name: Make the release
        id: make
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists already: its own run builds the image."
            echo "made=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # v1.3.0-rc.1 and the like are pre-releases.
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Gitberth ${GITHUB_REF_NAME#v}" $pre
          echo "made=true" >> "$GITHUB_OUTPUT"

  image:
    name: Image
    needs: [test, release]
    # After the tests; for a pushed tag, only when its release was made here (a release made on GitHub builds on its own).
    if: >-
      always() && needs.test.result == 'success' && github.event_name != 'pull_request'
      && (github.ref_type != 'tag' || github.event_name != 'push' || needs.release.outputs.made == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        id: name
        # Registry names are lowercase; the repository's may not be.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          # latest follows releases only, so `docker compose pull` with the install's compose file never picks up an
          # unreleased commit, nor a pre-release.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') && !(github.event_name == 'release' && github.event.release.prerelease) }}
            type=edge,branch=main
            type=sha
          # GitHub doesn't recognise PolyForm licenses, so the label is set here rather than taken from the repo.
          labels: |
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The version Gitberth shows: a release tag's number (main keeps the csproj's), and the commit.
          build-args: |
            GITBERTH_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            GITBERTH_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-image:
    name: Image on the release
    # Every release shows its Docker image: the image as files to download, one per platform, for `docker load`, and a
    # "Docker image" section in its notes with the pull command. A release's own run adds them right after the build; any
    # later run catches up a release that's missing them. What a release has already is left as it is.
    needs: [test, image]
    if: always() && needs.test.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Attach the image and name it in the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          releases="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts --json tagName,isPrerelease \
            --jq '.[] | "\(.tagName) \(.isPrerelease)"')"
          while read -r tag pre; do
            [ -n "$tag" ] || continue
            version="${tag#v}"
            # Not built (yet): nothing to show.
            index="$(docker buildx imagetools inspect --raw "$image:$version" 2>/dev/null)" || continue

            # The image as a file per platform: pulled by that platform's digest, saved under the release's tag.
            assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for arch in amd64 arm64; do
              file="gitberth-$version-linux-$arch.tar.gz"
              if grep -qx "$file" <<< "$assets"; then continue; fi
              digest="$(jq -r --arg a "$arch" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a)][0].digest // empty' <<< "$index")"
              [ -n "$digest" ] || continue
              docker pull -q "$image@$digest" > /dev/null
              docker tag "$image@$digest" "$image:$version"
              docker save "$image:$version" | gzip -6 > "$file"
              docker rmi -f "$image:$version" "$image@$digest" > /dev/null 2>&1 || true
              gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY"
              rm -f "$file"
              echo "Attached $file to $tag."
            done

            body="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            case "$body" in *"$image:$version"*) continue ;; esac
            if [ "$pre" = "true" ]; then
              tags="It's a pre-release, so \`latest\` doesn't move to it."
            else
              tags="\`${version%.*}\` follows the newest ${version%.*}.x release, and \`latest\` the newest release."
            fi
            assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            {
              printf '## Docker image\n\n'
              printf '`%s:%s`, for Intel/AMD and ARM. %s\n\n' "$image" "$version" "$tags"
              printf '```bash\ndocker pull %s:%s\n```\n\n' "$image" "$version"
              if grep -q "^gitberth-$version-linux-" <<< "$assets"; then
                printf 'The image is also attached below, for a machine that can'"'"'t reach ghcr.io: download `gitberth-%s-linux-amd64.tar.gz` (Intel/AMD) or `gitberth-%s-linux-arm64.tar.gz` (ARM) and load it:\n\n' "$version" "$version"
                printf '```bash\ndocker load -i gitberth-%s-linux-amd64.tar.gz\n```\n\n' "$version"
              fi
              printf 'Install it with the [installation guide](%s/blob/%s/docs/getting-started/install.md), or update an install with [Updating Gitberth](%s/blob/%s/docs/guides/updating-gitberth.md).\n\n' \
                "$repo_url" "$tag" "$repo_url" "$tag"
              printf '%s\n' "$body"
            } > notes.md
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            echo "Named $image:$version in the notes of $tag."
          done <<< "$releases"

