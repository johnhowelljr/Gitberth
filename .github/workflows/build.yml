# Tests every push and pull request. A published release, and every push to main, then publish the image to
# ghcr.io/<owner>/gitberth for Intel/AMD and ARM:
#   a release v1.2.3  →  :1.2.3, :1.2 and :latest (a pre-release gets only its own version, like :1.3.0-rc.1)
#   a push to main    →  :edge
#   every build       →  :sha-<commit>
# Releases are made on GitHub (Releases › Draft a new release), with a tag like v1.2.3. A tag pushed on its own builds
# nothing: the release is what publishes.
name: Build

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # The same SDK image the tests are run in by hand, so CI sees what a developer sees.
    container: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: dotnet test tests/Gitberth.Tests --nologo

  image:
    name: Image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        id: name
        # Registry names are lowercase; the repository's may not be.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          # latest follows releases only, so `docker compose pull` with the install's compose file never picks up an
          # unreleased commit.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=edge,branch=main
            type=sha
          # GitHub doesn't recognise PolyForm licenses, so the label is set here rather than taken from the repo.
          labels: |
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The version Gitberth shows: a release tag's number (main keeps the csproj's), and the commit.
          build-args: |
            GITBERTH_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            GITBERTH_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
