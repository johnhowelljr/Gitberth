# Gitberth: builds and runs your GitHub repos as containers on this Docker host.
#   Install:      curl -fsSL https://raw.githubusercontent.com/johnhowelljr/Gitberth/main/install.sh | sh
#   Update:       run the installer again, or: docker compose pull && docker compose up -d    (your apps keep running)
#   Logs:         docker compose logs -f gitberth
# Settings live in .env next to this file (see .env.example). To build Gitberth from this folder instead of pulling the
# published image, see docker-compose.build.yml.
name: gitberth  # fixes the data volume's name (gitberth_gitberth-data), whatever the folder is called
services:
  gitberth:
    image: ${GITBERTH_IMAGE:-ghcr.io/johnhowelljr/gitberth:latest}
    container_name: gitberth
    restart: unless-stopped
    ports:
      - "${GITBERTH_PORT:-8080}:8080"
    security_opt:
      - label=disable  # on SELinux hosts (Fedora, RHEL), so Gitberth may use the Docker socket; nothing elsewhere
    environment:
      GITBERTH_ADMIN_PASSWORD: ${GITBERTH_ADMIN_PASSWORD:-}  # used on first start only; change it in the UI later
      GITBERTH_PUBLIC_HOST: ${GITBERTH_PUBLIC_HOST:-}        # this machine's LAN address, used for app links
      TZ: ${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gitberth-data:/data

volumes:
  gitberth-data:
